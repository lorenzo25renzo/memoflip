<ion-content class="forgot-container" scroll="false">
  
  <!-- Purple Header Background -->
  <div class="purple-header"></div>
  
  <div class="forgot-wrapper">
    
    <!-- Back Button -->
    <div class="back-button">
      <ion-icon name="arrow-back" (click)="goBack()"></ion-icon>
    </div>

    <!-- Logo Section -->
    <div class="logo-section">
      <div class="logo-container">
        <div class="logo-placeholder">
          <span class="logo-emoji">🔐</span>
        </div>
        <h1 class="app-title">Forgot Password?</h1>
      </div>
    </div>

    <!-- White Card Content -->
    <div class="white-card">
      
      <div class="instruction-section">
        <p>Enter your email address and we'll send you a temporary password.</p>
      </div>

      <!-- Form -->
      <div class="form-section">
        <div class="input-group">
          <ion-label class="input-label">Email Address</ion-label>
          <ion-input 
            type="email" 
            placeholder="your.email@example.com"
            [(ngModel)]="email"
            class="custom-input">
          </ion-input>
        </div>

        <ion-button expand="block" class="reset-btn" (click)="resetPassword()">
          RESET PASSWORD
        </ion-button>
      </div>

      <!-- Back to Login Link -->
      <div class="login-link">
        <ion-text class="login-text" (click)="goBack()">Back to Login</ion-text>
      </div>

    </div>
  </div>
</ion-content>
